# TO-BE PostgreSQL stages (dev / test / staging / prod).
# Lifecycle is intentionally separate from backend/compose.yaml (meta DB):
# `docker compose -f infra/compose.tobe-stages.yaml down -v` only wipes
# stage data; the meta DB volume is untouched.
#
# Run from repo root:
#   docker compose -f infra/compose.tobe-stages.yaml up -d
#
# Bind-mount paths below (`../db/...`) are resolved relative to THIS
# compose file's location (infra/), not the working directory. That is
# docker compose v2's default behavior.

name: mpd-tobe

services:
  tobe-dev:
    image: ${POSTGRES_IMAGE:-postgres:17-alpine}
    container_name: mpd-tobe-dev
    environment:
      POSTGRES_DB:       tobe_dev
      POSTGRES_USER:     ${TOBE_USER:-tobe}
      POSTGRES_PASSWORD: ${TOBE_PASSWORD:-tobe}
    ports:
      - "${DEV_PORT:-5440}:5432"
    volumes:
      - ../db/tobe/dev/init.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ../db/sample_data/dev/load.sql:/docker-entrypoint-initdb.d/02_load_sample.sql:ro
      - ../db/sample_data/dev:/sample:ro
      - mpd_tobe_dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${TOBE_USER:-tobe} -d tobe_dev"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    networks: [mpd-tobe-net]

  tobe-test:
    image: ${POSTGRES_IMAGE:-postgres:17-alpine}
    container_name: mpd-tobe-test
    environment:
      POSTGRES_DB:       tobe_test
      POSTGRES_USER:     ${TOBE_USER:-tobe}
      POSTGRES_PASSWORD: ${TOBE_PASSWORD:-tobe}
    ports:
      - "${TEST_PORT:-5441}:5432"
    volumes:
      - ../db/tobe/test/init.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ../db/sample_data/test/load.sql:/docker-entrypoint-initdb.d/02_load_sample.sql:ro
      - ../db/sample_data/test:/sample:ro
      - mpd_tobe_test:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${TOBE_USER:-tobe} -d tobe_test"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    networks: [mpd-tobe-net]

  tobe-staging:
    image: ${POSTGRES_IMAGE:-postgres:17-alpine}
    container_name: mpd-tobe-staging
    environment:
      POSTGRES_DB:       tobe_staging
      POSTGRES_USER:     ${TOBE_USER:-tobe}
      POSTGRES_PASSWORD: ${TOBE_PASSWORD:-tobe}
    ports:
      - "${STAGING_PORT:-5442}:5432"
    volumes:
      - ../db/tobe/staging/init.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ../db/sample_data/staging/load.sql:/docker-entrypoint-initdb.d/02_load_sample.sql:ro
      - ../db/sample_data/staging:/sample:ro
      - mpd_tobe_staging:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${TOBE_USER:-tobe} -d tobe_staging"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    networks: [mpd-tobe-net]

  tobe-prod:
    image: ${POSTGRES_IMAGE:-postgres:17-alpine}
    container_name: mpd-tobe-prod
    environment:
      POSTGRES_DB:       tobe_prod
      POSTGRES_USER:     ${TOBE_USER:-tobe}
      POSTGRES_PASSWORD: ${TOBE_PASSWORD:-tobe}
    ports:
      - "${PROD_PORT:-5443}:5432"
    volumes:
      - ../db/tobe/prod/init.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ../db/sample_data/prod/load.sql:/docker-entrypoint-initdb.d/02_load_sample.sql:ro
      - ../db/sample_data/prod:/sample:ro
      - mpd_tobe_prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${TOBE_USER:-tobe} -d tobe_prod"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    networks: [mpd-tobe-net]

volumes:
  mpd_tobe_dev:
  mpd_tobe_test:
  mpd_tobe_staging:
  mpd_tobe_prod:

networks:
  mpd-tobe-net:
    driver: bridge

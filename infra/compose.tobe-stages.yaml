# TO-BE PostgreSQL stages (dev / test / staging / prod).
# Lifecycle is intentionally separate from backend/compose.yaml (meta DB):
# `docker compose -f infra/compose.tobe-stages.yaml down -v` only wipes
# stage data; the meta DB volume is untouched.
#
# Run from repo root:
#   docker compose -f infra/compose.tobe-stages.yaml up -d
#
# Bind-mount paths below (`../db/...`) are resolved relative to THIS
# compose file's location (infra/), not the working directory. That is
# docker compose v2's default behavior.
#
# DDL is split into 6 Project modules (01_master / 02_organization /
# 03_account / 04_trade / 05_market / 06_settlement) to mirror the
# tool's Project = one DDL unit model. 07_load_sample.sql is the
# sample-data \copy script, mounted last so it runs after every schema
# module is applied.

name: mpd-tobe

services:
  tobe-dev:
    image: ${POSTGRES_IMAGE:-postgres:17-alpine}
    container_name: mpd-tobe-dev
    environment:
      POSTGRES_DB:       tobe_dev
      POSTGRES_USER:     ${TOBE_USER:-tobe}
      POSTGRES_PASSWORD: ${TOBE_PASSWORD:-tobe}
    ports:
      - "${DEV_PORT:-5440}:5432"
    volumes:
      - ../db/tobe/dev/01_master.sql:/docker-entrypoint-initdb.d/01_master.sql:ro
      - ../db/tobe/dev/02_organization.sql:/docker-entrypoint-initdb.d/02_organization.sql:ro
      - ../db/tobe/dev/03_account.sql:/docker-entrypoint-initdb.d/03_account.sql:ro
      - ../db/tobe/dev/04_trade.sql:/docker-entrypoint-initdb.d/04_trade.sql:ro
      - ../db/tobe/dev/05_market.sql:/docker-entrypoint-initdb.d/05_market.sql:ro
      - ../db/tobe/dev/06_settlement.sql:/docker-entrypoint-initdb.d/06_settlement.sql:ro
      - ../db/tobe/dev/07_code.sql:/docker-entrypoint-initdb.d/07_code.sql:ro
      - ../db/sample_data/tobe/dev/load.sql:/docker-entrypoint-initdb.d/08_load_sample.sql:ro
      - ../db/sample_data/tobe/dev:/sample:ro
      - mpd_tobe_dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${TOBE_USER:-tobe} -d tobe_dev"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    networks: [mpd-tobe-net]

  tobe-test:
    image: ${POSTGRES_IMAGE:-postgres:17-alpine}
    container_name: mpd-tobe-test
    environment:
      POSTGRES_DB:       tobe_test
      POSTGRES_USER:     ${TOBE_USER:-tobe}
      POSTGRES_PASSWORD: ${TOBE_PASSWORD:-tobe}
    ports:
      - "${TEST_PORT:-5441}:5432"
    volumes:
      - ../db/tobe/test/01_master.sql:/docker-entrypoint-initdb.d/01_master.sql:ro
      - ../db/tobe/test/02_organization.sql:/docker-entrypoint-initdb.d/02_organization.sql:ro
      - ../db/tobe/test/03_account.sql:/docker-entrypoint-initdb.d/03_account.sql:ro
      - ../db/tobe/test/04_trade.sql:/docker-entrypoint-initdb.d/04_trade.sql:ro
      - ../db/tobe/test/05_market.sql:/docker-entrypoint-initdb.d/05_market.sql:ro
      - ../db/tobe/test/06_settlement.sql:/docker-entrypoint-initdb.d/06_settlement.sql:ro
      - ../db/tobe/test/07_code.sql:/docker-entrypoint-initdb.d/07_code.sql:ro
      - ../db/sample_data/tobe/test/load.sql:/docker-entrypoint-initdb.d/08_load_sample.sql:ro
      - ../db/sample_data/tobe/test:/sample:ro
      - mpd_tobe_test:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${TOBE_USER:-tobe} -d tobe_test"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    networks: [mpd-tobe-net]

  tobe-staging:
    image: ${POSTGRES_IMAGE:-postgres:17-alpine}
    container_name: mpd-tobe-staging
    environment:
      POSTGRES_DB:       tobe_staging
      POSTGRES_USER:     ${TOBE_USER:-tobe}
      POSTGRES_PASSWORD: ${TOBE_PASSWORD:-tobe}
    ports:
      - "${STAGING_PORT:-5442}:5432"
    volumes:
      - ../db/tobe/staging/01_master.sql:/docker-entrypoint-initdb.d/01_master.sql:ro
      - ../db/tobe/staging/02_organization.sql:/docker-entrypoint-initdb.d/02_organization.sql:ro
      - ../db/tobe/staging/03_account.sql:/docker-entrypoint-initdb.d/03_account.sql:ro
      - ../db/tobe/staging/04_trade.sql:/docker-entrypoint-initdb.d/04_trade.sql:ro
      - ../db/tobe/staging/05_market.sql:/docker-entrypoint-initdb.d/05_market.sql:ro
      - ../db/tobe/staging/06_settlement.sql:/docker-entrypoint-initdb.d/06_settlement.sql:ro
      - ../db/tobe/staging/07_code.sql:/docker-entrypoint-initdb.d/07_code.sql:ro
      - ../db/sample_data/tobe/staging/load.sql:/docker-entrypoint-initdb.d/08_load_sample.sql:ro
      - ../db/sample_data/tobe/staging:/sample:ro
      - mpd_tobe_staging:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${TOBE_USER:-tobe} -d tobe_staging"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    networks: [mpd-tobe-net]

  tobe-prod:
    image: ${POSTGRES_IMAGE:-postgres:17-alpine}
    container_name: mpd-tobe-prod
    environment:
      POSTGRES_DB:       tobe_prod
      POSTGRES_USER:     ${TOBE_USER:-tobe}
      POSTGRES_PASSWORD: ${TOBE_PASSWORD:-tobe}
    ports:
      - "${PROD_PORT:-5443}:5432"
    volumes:
      - ../db/tobe/prod/01_master.sql:/docker-entrypoint-initdb.d/01_master.sql:ro
      - ../db/tobe/prod/02_organization.sql:/docker-entrypoint-initdb.d/02_organization.sql:ro
      - ../db/tobe/prod/03_account.sql:/docker-entrypoint-initdb.d/03_account.sql:ro
      - ../db/tobe/prod/04_trade.sql:/docker-entrypoint-initdb.d/04_trade.sql:ro
      - ../db/tobe/prod/05_market.sql:/docker-entrypoint-initdb.d/05_market.sql:ro
      - ../db/tobe/prod/06_settlement.sql:/docker-entrypoint-initdb.d/06_settlement.sql:ro
      - ../db/tobe/prod/07_code.sql:/docker-entrypoint-initdb.d/07_code.sql:ro
      - ../db/sample_data/tobe/prod/load.sql:/docker-entrypoint-initdb.d/08_load_sample.sql:ro
      - ../db/sample_data/tobe/prod:/sample:ro
      - mpd_tobe_prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${TOBE_USER:-tobe} -d tobe_prod"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    networks: [mpd-tobe-net]

volumes:
  mpd_tobe_dev:
  mpd_tobe_test:
  mpd_tobe_staging:
  mpd_tobe_prod:

networks:
  mpd-tobe-net:
    driver: bridge

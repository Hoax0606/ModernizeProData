spring:
  application:
    name: modernize-pro-data

  # ── Docker Compose 자동 기동 비활성 ───────────────────────────────────
  # 기본 PG 경로는 인스톨러 동봉 (production) / 로컬 설치본 (dev). compose
  # 는 명시적으로 `docker compose up` 으로만 사용. compose 사용 원하면
  # profile/env 에서 enabled=true 로 overrride.
  docker:
    compose:
      enabled: false

  # ── 메타 DB (Coordinator 가 보관하는 매핑·사용자·audit log 등) ─────────
  # PostgreSQL 18. 운영 시 인스톨러가 동봉 PG 를 별도 포트로 설치.
  # 접속 정보는 환경 변수로 주입 (12-factor).
  datasource:
    url:      ${DB_URL:jdbc:postgresql://localhost:5432/mpd_meta}
    username: ${DB_USER:mpd}
    password: ${DB_PASSWORD:mpd}
    driver-class-name: org.postgresql.Driver
    hikari:
      # Coord = LoadStage 병렬 4 thread + Quartz 5 thread + REST handler 여유.
      # Coord 1 + Worker 3 동시 polling (lightSync 5s / heavySync 10s / 각 화면별
      # 5s polling) + LoadStage / Quartz 까지 = 25+ slot 필요. HIKARI_POOL_MAX
      # 로 site 별 override.
      # 5 user × master setBaseline 같은 burst 시 pool exhaust 방지로 30→50.
      # prod PG `max_connections` 와 균형 확인 필요 (현재 dev/test PG default 100).
      maximum-pool-size: ${HIKARI_POOL_MAX:50}
      connection-timeout: 5000
      # 5분 idle 이후 회수. 작업 burst 후 connection slot 빠르게 반환.
      idle-timeout: 300000
      # 30분 max-lifetime — PG 의 server-side timeout 보다 짧게.
      max-lifetime: 1800000

  jpa:
    # Flyway 가 스키마 단일 책임. Hibernate 는 검증만.
    hibernate:
      ddl-auto: validate
    # SQL log — bottleneck 진단 시 env var SPRING_JPA_SHOW_SQL=true 로 toggle.
    # production default = false (overhead 큼).
    show-sql: ${SPRING_JPA_SHOW_SQL:false}
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  # ── Flyway — 스키마 마이그레이션 단독 관리 ───────────────────────────
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    out-of-order: true

  # ── Spring Batch — 자체 init 끔. Flyway 가 V1 로 스키마 적용. ──────
  batch:
    jdbc:
      initialize-schema: never

  # ── Quartz 스케줄러 ──────────────────────────────────────────────────
  # PoC: memory job-store (재시작 시 job 초기화).
  # production: jdbc 로 전환 시 Flyway 마이그레이션에 Quartz 스크립트 추가 필요.
  quartz:
    job-store-type: memory
    properties:
      org.quartz.threadPool.threadCount: 5

  # 기본 자동 사용자 생성 비활성 (JWT 직접 처리)
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

# ── 서버 설정 ───────────────────────────────────────────────────────────
server:
  address: 0.0.0.0
  port: 8080
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

# ── ModernizeProData 자체 설정 ──────────────────────────────────────────
modernize:
  # 빌드 시점 version (pom.xml 의 <version>). Spring Boot 의 application.yml
  # resource filtering 이 @project.version@ 을 maven build 때 실 값으로 치환.
  # UpdateService 가 jar manifest 의 Implementation-Version 대신 이 값을 우선
  # 사용 → mvnw spring-boot:run (dev) 에서도 정상 표시.
  version: @project.version@

  # 도구 동작 모드: coordinator | worker | standalone
  # 인스톨러가 사용자 선택을 MPD_MODE env 로 전달하면 그 값이 우선.
  mode: ${MPD_MODE:coordinator}

  # JWT
  # PoC secret. Production 직전 rotate. 환경 변수 JWT_SECRET 로 override 가능.
  # 생성: openssl rand -base64 64
  jwt:
    secret: ${JWT_SECRET:2h0DvU8r0PfHRT3RoGw3m/qSe+4EYMDY3IfwVeDdnOKm8cmOGvhQDKv/IS1Wr/bHmn0vVfv+eDbVuWyMl3IqkQ==}
    expiration-hours: 8

  # CORS (개발 시 Vite dev server 허용)
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:5173,http://localhost:8080}

  # Coordinator 정보 (Worker 모드일 때 사용)
  coordinator:
    url: ${COORDINATOR_URL:http://localhost:8080}
    # Coordinator 가 자기 자신을 master 로 운영할 때의 username — 이 user 가 어떤 project 의
    # assignee 로 잡혀있으면 Worker 등록 검사를 건너뛰고 Coordinator 자기 backend 에서 local
    # 실행한다 (자기는 Worker daemon 으로 self-register 할 일이 없으니).
    self-username: ${COORDINATOR_SELF_USERNAME:master}

  # DuckDB — 각 노드의 local 디스크 (Coordinator·Worker 각자 사용). envvar override 가능.
  duckdb:
    memory-mode: true # false 면 파일 모드 (사이트=prod 는 application-prod.yml 에서 false)
    file-path:      ${MPD_DUCKDB_PATH:./data/duckdb.db}
    temp-directory: ${MPD_DUCKDB_TEMP:./data/duckdb-tmp} # 대용량 spill 위치

  # Run 산출물 (parquet1 / parquet2 / quarantine) — 각 노드의 local 디스크.
  # 4대 분산 시 각 PC 마다 SSD 위치 등을 다르게 잡고 싶으면 MPD_OUTPUT_BASE_PATH 환경 변수로 override.
  # default: C:/modernize/output (PR run-output 결정 — system-wide, user-independent).
  output:
    base-path: ${MPD_OUTPUT_BASE_PATH:C:/modernize/output}

  # ── perf 측정 인프라 (dev 진단 한정) ─────────────────────────────────
  # true 일 때만 DuckDB lock 계측 + Hibernate generate_statistics 주기 dump +
  # /actuator/metrics 노출. application-dev.yml 에서 override.
  # prod default false → 측정 코드는 if (perfEnabled) 분기 한 줄만 진입, 오버헤드 사실상 0.
  perf:
    enabled: ${MPD_PERF:false}

  # Run 실행 튜닝 — LoadStage 의 binding 단위 병렬도. 1 = 순차 (옛 default).
  # HikariCP pool size 10 + Hikari connection-timeout 5s 라 worker 노드 안에서
  # 4 thread 까지 안전. 대용량 BANKSYS 데모에선 thread overhead < I/O wait 이라
  # 거의 항상 이득. LOAD_PARALLELISM 환경 변수로 site 별 override 가능.
  run:
    load-parallelism: ${LOAD_PARALLELISM:4}

# ── 로깅 ────────────────────────────────────────────────────────────────
logging:
  level:
    root: INFO
    com.ksinfo.modernize_pro_data: DEBUG
    org.springframework.security: INFO
    org.springframework.web: INFO
    # HikariCP pool stat — DEBUG 면 매 connection acquire / release 로깅 부담.
    # INFO 면 startup banner + leak / failure 만. P3-7 검증 시 stress 환경에서만 DEBUG.
    com.zaxxer.hikari: INFO
    # SQL trace — env var SPRING_JPA_SHOW_SQL=true 와 같이 toggle 해야 의미.
    # bottleneck 진단 시 LOG_SQL_LEVEL=DEBUG 로 reproduce → query + binding 확인.
    org.hibernate.SQL: ${LOG_SQL_LEVEL:WARN}
    org.hibernate.orm.jdbc.bind: ${LOG_SQL_LEVEL:WARN}
  pattern:
    # traceId — TraceIdFilter 가 모든 /api/** request 에 MDC put. 다중 사용자
    # 측정 시 한 사용자 흐름을 grep 으로 묶기 위해. perf 미사용 시에는 비어있음.
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] [%X{traceId:-}] %logger{36} - %msg%n"

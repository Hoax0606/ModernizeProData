# prod profile — jpackage 인스톨러로 설치된 Coordinator 가 활성화.
# Launcher 가 `-Dspring.profiles.active=prod` 로 시작.
#
# 사용자 PC 의 host native PostgreSQL (CLAUDE.md default: 포트 5433,
# DB mpd_meta, user/pw mpd/mpd) 를 그대로 사용. 환경 변수 DB_URL /
# DB_USER / DB_PASSWORD 로 override 가능.

spring:
  datasource:
    url:      ${DB_URL:jdbc:postgresql://localhost:5433/mpd_meta}
    username: ${DB_USER:mpd}
    password: ${DB_PASSWORD:mpd}

  jpa:
    open-in-view: false
    show-sql: false

  # 개발 편의 기능 끔.
  devtools:
    livereload:
      enabled: false
    restart:
      enabled: false

# 인스톨된 환경 — Vite dev server origin 은 더 이상 필요 없음.
modernize:
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:8080}
  license:
    public-key: ${MPD_LICENSE_PUBKEY:classpath:license/public.pem}

logging:
  level:
    root: INFO
    com.ksinfo.modernize_pro_data: INFO
    org.hibernate.SQL: WARN
    org.springframework.security: WARN

# prod profile — jpackage 인스톨러로 설치된 Coordinator 가 활성화.
# Launcher 가 `-Dspring.profiles.active=prod` 로 시작.
#
# 메타 PG 는 installer 동봉 (PG 18, port 5432, DB mpd_meta, user/pw mpd/mpd).
# 기존 PG 가 5432 점유면 installer 가 user 선택 — 기존 사용 or 다른 port 로 별도 install.
# 환경 변수 DB_URL / DB_USER / DB_PASSWORD 로 override 가능.

spring:
  datasource:
    url:      ${DB_URL:jdbc:postgresql://localhost:5432/mpd_meta}
    username: ${DB_USER:mpd}
    password: ${DB_PASSWORD:mpd}

  jpa:
    open-in-view: false
    show-sql: false

  # 개발 편의 기능 끔.
  devtools:
    livereload:
      enabled: false
    restart:
      enabled: false

# 인스톨된 환경 — Vite dev server origin 은 더 이상 필요 없음.
modernize:
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:8080}
  license:
    public-key: ${MPD_LICENSE_PUBKEY:classpath:license/public.pem}
  # 현장 대용량 — 파일 모드로 테이블도 디스크 spill (RAM 초과 OOM 내성). dev/test 는 base 의 in-memory 유지.
  duckdb:
    memory-mode: false

logging:
  level:
    root: INFO
    com.ksinfo.modernize_pro_data: INFO
    org.hibernate.SQL: WARN
    org.springframework.security: WARN
